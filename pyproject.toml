[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "rpi-eeprom"
version = "1.1.0"
description = "Raspberry Pi EEPROM management tool for reading, writing, and managing EEPROM content on RPi HAT devices"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.10"
authors = [
    { name = "Ubopod" },
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: System :: Hardware",
]
dependencies = [
    "pyyaml>=6.0",
]

[project.optional-dependencies]
gpio = ["gpiozero>=2.0"]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "ruff>=0.4",
    "mypy>=1.10",
]

[project.scripts]
rpi-eeprom = "rpi_eeprom.cli._main:main"

[project.urls]
Homepage = "https://github.com/ubopod/rpi-eeprom"
Repository = "https://github.com/ubopod/rpi-eeprom"

[tool.hatch.build.targets.wheel]
packages = ["src/rpi_eeprom"]

[tool.hatch.build.targets.sdist]
include = [
    "src/rpi_eeprom/",
    "tests/",
    "LICENSE",
    "README.md",
    "THIRD_PARTY_NOTICES",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "hardware: end-to-end tests that require a physical EEPROM on I2C (run with: sudo pytest -m hardware)",
]
addopts = "-m 'not hardware'"

[tool.ruff]
src = ["src", "tests"]
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.mypy]
python_version = "3.10"
strict = true
warn_return_any = true
warn_unused_configs = true
